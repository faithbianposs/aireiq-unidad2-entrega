apiVersion: 1

datasources:
  - name: AireIQ PostgreSQL
    uid: aireiq-postgres
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}